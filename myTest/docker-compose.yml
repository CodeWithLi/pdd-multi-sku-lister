# Docker Compose 生产部署
# 用法见 deploy/DEPLOY.md

services:
  mysql:
    image: mysql:8.0
    container_name: pdd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pdd_agent_platform}
      MYSQL_USER: ${MYSQL_USER:-pdd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_pdd}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pdd-net

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: pdd-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-pdd}:${MYSQL_PASSWORD:-changeme_pdd}@mysql:3306/${MYSQL_DATABASE:-pdd_agent_platform}?charset=utf8mb4
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      PDD_DATA_DIR: /app/data
      PDD_CONFIG_PATH: /app/config/settings.yaml
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
    shm_size: "1gb"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - pdd-net
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: pdd-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pdd-net

volumes:
  mysql_data:

networks:
  pdd-net:
    driver: bridge
