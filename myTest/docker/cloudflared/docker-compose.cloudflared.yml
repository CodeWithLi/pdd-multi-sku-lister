# 用 Cloudflare Tunnel 暴露服务（无需公网 IP / 端口映射）
# 前置：在 Cloudflare Zero Trust 创建 Tunnel，Public Hostname 指向 http://frontend:80
# 用法：docker compose -f docker-compose.yml -f docker/cloudflared/docker-compose.cloudflared.yml up -d

services:
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: pdd-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_started
    networks:
      - pdd-net
