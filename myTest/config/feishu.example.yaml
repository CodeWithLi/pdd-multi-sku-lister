# 飞书多维表格集成配置
# 复制：cp config/feishu.example.yaml config/feishu.yaml

app_id: ""
app_secret: ""
oauth_redirect_uri: "http://127.0.0.1:8010/api/feishu/oauth/callback"
oauth_scope: "offline_access bitable:app"
use_user_access_token: true
user_access_token: ""
user_access_token_expires_at: 0
refresh_token: ""
refresh_token_expires_at: 0

# 浏览器地址 https://xxx.feishu.cn/base/{app_token}?table={table_id}
bitable_app_token: ""
table_id: ""

# 新建表时使用；若已有表（如截图 tblan7b1NAj8MFFN）直接填 table_id 即可
table_name: "拼多多每日上架商品日志"

# 列名与「技术支持」Base 保持一致（截图里是「宝贝标签」不是「宝贝标题」）
field_names:
  date: "日期"
  link: "商品链接"
  title: "宝贝标签"
  price: "一口价"
  merchant_code: "商家编码"
  sku_count: "规格数"
  published_at: "发布时间"
  status: "状态"
  mapping_id: "映射ID"
  account_id: "店铺"
  pdd_product_id: "拼多多商品ID"
  product_code: "商品编码"
  image_set: "套图"

merchant_goods_url_template: "https://mms.pinduoduo.com/goods/goods_detail?goods_id={pdd_product_id}"
product_link_template: "https://mobile.yangkeduo.com/goods.html?goods_id={pdd_product_id}"

# 已有表没有「映射ID」列时留空 ""，测试阶段可关闭去重
dedupe_field: ""

status_options:
  - 在售
  - 已下架
  - 未知

# 上架核验成功（20s 后在售）后异步写入「PDD发布日志表」；失败写入「淘宝+拼多多发布日志表（失败）」
pdd_upload_log:
  enabled: true
  table_id: ""
  table_name: PDD发布日志表
  failure_table_id: ""
  failure_table_name: 淘宝+拼多多发布日志表（失败）
  dedupe_field: 商品ID
  failure_record_type_options:
    - 失败
    - 跳过
  failure_report_platform_options:
    - 拼多多
    - 淘宝
  failure_default_report_platform: 拼多多
  field_names:
    date: 日期
    merchant_code: 商品编码
    title: 标题
    account_name: 店铺名称
    product_id: 商品ID
    link: 商品链接
    publish_start: 发布开始时间
    publish_end: 发布结束时间
    duration_seconds: 耗时秒
  failure_field_names:
    date: 日期
    merchant_code: 商品编码
    report_platform: 报错平台
    account_name: 店铺名称
    record_type: 记录类型
    failure_reason: 失败原因
    publish_start: 发布开始时间
    publish_end: 发布结束时间
    duration_seconds: 耗时秒
    process_completed: 是否处理完成
    # 与飞书表列名完全一致；若列名含前缀也会自动按「处理状态镜像」匹配
    process_status_mirror: （不要动）处理状态镜像
    cycle_relist: 是否循环上架
    processor: 人员
    processed_at: 处理时间

# 整合链路活动步骤
pdd_activity_log:
  enabled: true
  table_id: ""
  table_name: PDD活动日志表
  dedupe_field: 商品ID
  activity_618_id: "20981"
  activity_discount_id: "21365"
  seed_on_listing: true
  immediate_find_retries: 2
  field_names:
    date: 日期
    account_name: 店铺名称
    product_id: 商品ID
    limited_time_status: 限时限量购状态
    limited_time_failure_reason: 限时限量购失败原因
    activity_618_status: 618状态
    activity_618_failure_reason: 618失败原因
    activity_discount_status: 七折状态
    activity_discount_failure_reason: 七折失败原因

# 推广创建步骤：成功/失败写入同一张飞书表
pdd_promotion_log:
  enabled: true
  table_id: ""
  table_name: PDD推广日志表
  result_options:
  - 成功
  - 失败
  field_names:
    date: 日期
    account_name: 店铺名称
    product_id: 商品ID
    result: 推广结果
    message: 备注
    failure_reason: 失败原因
    run_id: 运行ID

# 拼多多所有商品.xls → 飞书「拼多多比价定价」（商品编码/颜色规格/商品类型/可用库存/拼多多定价）
pdd_product_catalog:
  enabled: true
  table_id: ""
  table_name: 拼多多比价定价
  excel_relpath: data/assets/拼多多所有商品.xls
  prefer_feishu: true
  fallback_excel: false
  cache_seconds: 300
  price_float_enabled: true
  price_float_min: 0
  price_float_max: 5
  field_names:
    product_code: 商品编码
    color_spec: 颜色规格
    product_type: 商品类型
    available_inventory: 可用库存
    pricing: 拼多多定价

# pdd.xls 控价区间 → 飞书「拼多多比价定价」
pdd_price_compare:
  enabled: true
  table_id: ""
  table_name: 拼多多比价定价
  excel_relpath: data/assets/pdd.xls
  pricing_excel_relpath: data/assets/拼多多定价.xls
  control_excel_relpath: data/assets/拼多多控价.xls
  prefer_feishu: true
  fallback_excel: false
  cache_seconds: 300
  field_names:
    merchant_code: 商品编码
    min_price: PDD控价下限价格
    max_price: PDD控价上限价格
    pdd_pricing: 拼多多定价
    pdd_control_price: 拼多多控价
pipeline:
  excel_fallback_enabled: false
