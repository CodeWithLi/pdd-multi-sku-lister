# 复制为 settings.yaml 后修改

app:
  name: pdd-agent-platform
  log_level: INFO

paths:
  assets_root: data/assets          # 商品素材根目录
  profiles_root: data/profiles      # 浏览器 Profile（每店铺一个子目录）
  runs_root: data/runs              # 任务执行记录

browser:
  headless: false
  slow_mo: 0
  default_timeout_ms: 30000
  base_url: https://mms.pinduoduo.com

multi_spec:
  excel: data/assets/sku+名称.xlsx
  defaults:
    inventory: "10"
    group_price: "199.9"
    single_price: "299.9"

accounts:
  - account_id: store_A
    enabled: true
    username: ""
    password: ""
    product_codes: []
