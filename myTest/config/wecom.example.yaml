# 企业微信消息推送（群 Webhook）
# 复制：cp config/wecom.example.yaml config/wecom.yaml

enabled: false
webhook_url: ""
# 日报专用 Webhook；留空则回退使用 webhook_url
webhook_url_daily_report: ""

# 业务自动通知（需 enabled=true 且 webhook_url 已配置）
notify_on_listing_failed: false
notify_on_pipeline_failed: false
notify_on_commerce_queued: false
notify_on_commerce_dispatched: false

# 日报定时发送（需 enabled=true、webhook_url 已配置，且 daily_report_schedule_enabled=true）
daily_report_schedule_enabled: false
daily_report_schedule_hour: 18
daily_report_schedule_minute: 0
